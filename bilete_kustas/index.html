<!doctype html>
<html lang="lv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Paris Express — Interior Mystery</title>

  <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html,body{
      margin:0;width:100%;height:100%;overflow:hidden;background:#000;
      font-family:Arial,sans-serif;touch-action:none
    }
    #startOverlay{
      position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;
      background:rgba(0,0,0,.94);color:#fff;padding:24px;box-sizing:border-box;text-align:center
    }
    .card{max-width:460px}
    .card h1{margin:0 0 12px;font-size:30px}
    .card p{line-height:1.5;opacity:.9}
    #startBtn,#replay{
      border:0;border-radius:999px;padding:14px 22px;font-size:17px;font-weight:700;cursor:pointer
    }
    #status{
      position:fixed;z-index:20;left:50%;bottom:18px;transform:translateX(-50%);
      background:rgba(0,0,0,.72);color:#fff;padding:10px 15px;border-radius:999px;
      font-size:14px;white-space:nowrap;pointer-events:none
    }
    #replay{
      position:fixed;z-index:20;right:14px;top:14px;display:none;background:#fff;color:#111;padding:10px 14px
    }
  </style>
</head>
<body>

<div id="startOverlay">
  <div class="card">
    <h1>🥂 PARIS EXPRESS · 1932</h1>
    <p>
      Pavērs telefonu pret biļeti. Atvērsies grezns vilciena interjers.
      Fonā skan vilciens un Parīzes mūzika. Pēc brīža — šāviens.
    </p>
    <button id="startBtn">SĀKT CEĻOJUMU</button>
  </div>
</div>

<div id="status">Pavērs kameru pret biļeti</div>
<button id="replay">↻ Atkārtot</button>

<a-scene
  mindar-image="imageTargetSrc: bilete.mind; autoStart:false; filterMinCF:0.0001; filterBeta:0.001;"
  color-space="sRGB"
  renderer="colorManagement:true; physicallyCorrectLights:true"
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:false">

  <a-assets>
    <img id="interiorImg" src="train_interior.jpg">
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

  <a-entity id="ticketTarget" mindar-image-target="targetIndex:0">

    <!-- Main 2.5D image portal -->
    <a-entity id="portal" position="0 0.03 0.08" scale="0.001 0.001 0.001">
      <a-plane
        id="interiorPlane"
        src="#interiorImg"
        width="1.22"
        height="1.63"
        position="0 0 0"
        material="shader:flat; side:double">
      </a-plane>

      <!-- subtle warm vignette frame -->
      <a-plane
        width="1.30"
        height="1.72"
        position="0 0 -0.012"
        color="#2b160f"
        opacity="0.92">
      </a-plane>

      <!-- soft gold title -->
      <a-entity id="introText" position="0 0.64 0.03">
        <a-text value="PARIS EXPRESS" align="center" color="#f0d39a" width="1.85"></a-text>
        <a-text value="DINING CAR · 21:12" position="0 -0.09 0" align="center" color="#ffffff" width="1.25"></a-text>
      </a-entity>

      <!-- moving window-light illusion -->
      <a-plane id="lightSweep"
        width="0.18" height="1.45"
        position="-0.62 0 0.025"
        color="#ffe8a8"
        opacity="0.12">
      </a-plane>

      <!-- dark veil + murder message -->
      <a-plane id="darkveil"
        visible="false"
        width="1.30" height="1.72"
        position="0 0 0.04"
        color="#000000"
        opacity="0.77">
      </a-plane>

      <a-entity id="murderCard" visible="false" position="0 0 0.055">
        <a-text value="PARIS EXPRESS · 21:17"
          position="0 0.30 0"
          align="center"
          color="#c8a66a"
          width="1.55">
        </a-text>

        <a-text value="A GUNSHOT WAS HEARD"
          position="0 0.08 0"
          align="center"
          color="#ffffff"
          width="1.60">
        </a-text>

        <a-text value="FROM COMPARTMENT 7."
          position="0 -0.08 0"
          align="center"
          color="#ffffff"
          width="1.60">
        </a-text>

        <a-text value="A PASSENGER HAS BEEN FOUND DEAD."
          position="0 -0.28 0"
          align="center"
          color="#ffffff"
          width="1.55">
        </a-text>

        <a-text id="finalLine" value=""
          position="0 -0.47 0"
          align="center"
          color="#b94a4a"
          width="1.45">
        </a-text>
      </a-entity>

    </a-entity>
  </a-entity>
</a-scene>

<script>
const sceneEl=document.querySelector('a-scene');
const targetEl=document.querySelector('#ticketTarget');
const portal=document.querySelector('#portal');
const introText=document.querySelector('#introText');
const lightSweep=document.querySelector('#lightSweep');
const darkveil=document.querySelector('#darkveil');
const murderCard=document.querySelector('#murderCard');
const finalLine=document.querySelector('#finalLine');
const startOverlay=document.querySelector('#startOverlay');
const startBtn=document.querySelector('#startBtn');
const statusEl=document.querySelector('#status');
const replayBtn=document.querySelector('#replay');

let targetVisible=false, sequenceRunning=false, sequenceFinished=false;
let timers=[], audioCtx=null, masterGain=null;
let trainBuffer=null, parisBuffer=null, trainSource=null, parisSource=null;

function clearTimers(){timers.forEach(clearTimeout);timers=[];}

async function loadBuffer(url,required=false){
  try{
    const r=await fetch(url);
    if(!r.ok) throw new Error(url);
    return await audioCtx.decodeAudioData(await r.arrayBuffer());
  }catch(e){
    if(required) throw e;
    return null;
  }
}

async function unlockAudio(){
  if(!audioCtx){
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    masterGain=audioCtx.createGain();
    masterGain.gain.value=.92;
    masterGain.connect(audioCtx.destination);
  }
  if(audioCtx.state==='suspended') await audioCtx.resume();

  if(!trainBuffer) trainBuffer=await loadBuffer('train_paris.mp3',true);
  if(!parisBuffer) parisBuffer=await loadBuffer('paris_music.mp3',false);
}

function stopSource(s){
  if(s){
    try{s.stop()}catch(e){}
    try{s.disconnect()}catch(e){}
  }
}

function playLoop(buffer,gainValue){
  if(!buffer)return null;
  const src=audioCtx.createBufferSource();
  const g=audioCtx.createGain();
  g.gain.value=gainValue;
  src.buffer=buffer;
  src.loop=true;
  src.connect(g);
  g.connect(masterGain);
  src.start(0);
  return src;
}

function startAmbience(){
  stopSource(trainSource);
  stopSource(parisSource);
  trainSource=playLoop(trainBuffer,.42);
  parisSource=playLoop(parisBuffer,.60);
}

function stopAmbience(){
  stopSource(trainSource);trainSource=null;
  stopSource(parisSource);parisSource=null;
}

function gunshot(){
  if(!audioCtx||!masterGain)return;
  const now=audioCtx.currentTime;

  const buffer=audioCtx.createBuffer(1,Math.floor(audioCtx.sampleRate*1.0),audioCtx.sampleRate);
  const data=buffer.getChannelData(0);
  for(let i=0;i<data.length;i++){
    data[i]=(Math.random()*2-1)*Math.pow(1-i/data.length,5);
  }

  const noise=audioCtx.createBufferSource();
  noise.buffer=buffer;

  const lp=audioCtx.createBiquadFilter();
  lp.type='lowpass';
  lp.frequency.value=2800;

  const ng=audioCtx.createGain();
  ng.gain.setValueAtTime(1.8,now);
  ng.gain.exponentialRampToValueAtTime(0.001,now+.72);

  noise.connect(lp);
  lp.connect(ng);
  ng.connect(masterGain);
  noise.start(now);

  const boom=audioCtx.createOscillator();
  const bg=audioCtx.createGain();
  boom.type='sine';
  boom.frequency.setValueAtTime(135,now);
  boom.frequency.exponentialRampToValueAtTime(30,now+.85);
  bg.gain.setValueAtTime(1.45,now);
  bg.gain.exponentialRampToValueAtTime(.001,now+1.05);
  boom.connect(bg);
  bg.connect(masterGain);
  boom.start(now);
  boom.stop(now+1.1);
}

function resetScene(){
  clearTimers();
  stopAmbience();

  portal.setAttribute('scale','0.001 0.001 0.001');
  portal.removeAttribute('animation__open');

  introText.setAttribute('visible',true);
  darkveil.setAttribute('visible',false);
  murderCard.setAttribute('visible',false);
  finalLine.setAttribute('value','');

  sequenceRunning=false;
  sequenceFinished=false;
}

function runSequence(){
  if(!targetVisible||sequenceRunning||sequenceFinished)return;

  sequenceRunning=true;
  statusEl.textContent='Restorānvagons atveras…';

  portal.setAttribute('animation__open',{
    property:'scale',
    from:'0.001 0.001 0.001',
    to:'1.35 1.35 1.35',
    dur:950,
    easing:'easeOutBack'
  });

  lightSweep.setAttribute('animation',{
    property:'position',
    from:'-0.62 0 0.025',
    to:'0.62 0 0.025',
    dur:1400,
    loop:true,
    easing:'linear'
  });

  startAmbience();

  timers.push(setTimeout(()=>{
    introText.setAttribute('visible',false);
  },4200));

  timers.push(setTimeout(()=>{
    stopSource(parisSource);
    parisSource=null;
    gunshot();
    statusEl.textContent='...';
  },12000));

  timers.push(setTimeout(()=>{
    darkveil.setAttribute('visible',true);
    murderCard.setAttribute('visible',true);
  },13500));

  timers.push(setTimeout(()=>{
    finalLine.setAttribute('value','YOUR JOURNEY HAS CHANGED.');
  },15400));

  timers.push(setTimeout(()=>{
    stopSource(trainSource);
    trainSource=null;
    statusEl.textContent='Compartment No. 7';
    sequenceRunning=false;
    sequenceFinished=true;
    replayBtn.style.display='block';
  },17400));
}

startBtn.addEventListener('click',async()=>{
  try{
    await unlockAudio();
  }catch(e){
    alert('Neizdevās ielādēt train_paris.mp3.');
    return;
  }

  startOverlay.style.display='none';
  const arSystem=sceneEl.systems['mindar-image-system'];
  if(arSystem) arSystem.start();
  statusEl.textContent='Meklēju biļeti…';
});

targetEl.addEventListener('targetFound',()=>{
  targetVisible=true;
  statusEl.textContent='Biļete atrasta ✨';
  runSequence();
});

targetEl.addEventListener('targetLost',()=>{
  targetVisible=false;
  stopAmbience();
  statusEl.textContent='Pavērs kameru atpakaļ pret biļeti';
});

replayBtn.addEventListener('click',async()=>{
  try{await unlockAudio()}catch(e){}
  replayBtn.style.display='none';
  resetScene();
  if(targetVisible) runSequence();
});
</script>
</body>
</html>
